[versions]
agp = "8.6.0"
kotlin = "2.0.0"

coreKtx = "1.10.1"
lifecycle = "2.6.1"
activityCompose = "1.8.0"
composeBom = "2024.09.00"
coil = "2.6.0"

junit = "4.13.2"
androidxJunit = "1.1.5"
espresso = "3.5.1"

retrofit = "2.11.0"
gsonConverter = "2.11.0"
okhttp = "4.12.0"
gson = "2.10.1"

navigation = "2.7.7"

composeAnimation = "1.6.1"

room = "2.7.0"
ksp = "2.0.0-1.0.24"
runtime = "1.10.2"

[libraries]
# Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

# Lifecycle
androidx-lifecycle-runtime-ktx = { group="androidx.lifecycle", name="lifecycle-runtime-ktx", version.ref="lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group="androidx.lifecycle", name="lifecycle-viewmodel-ktx", version.ref="lifecycle" }
androidx-lifecycle-runtime-compose = { group="androidx.lifecycle", name="lifecycle-runtime-compose", version.ref="lifecycle" }

# Activity
androidx-activity-compose = { group="androidx.activity", name="activity-compose", version.ref="activityCompose" }

# Compose BOM
androidx-compose-bom = { group="androidx.compose", name="compose-bom", version.ref="composeBom" }

# Compose UI
androidx-compose-ui = { group="androidx.compose.ui", name="ui" }
androidx-compose-ui-graphics = { group="androidx.compose.ui", name="ui-graphics" }
androidx-compose-ui-tooling = { group="androidx.compose.ui", name="ui-tooling" }
androidx-compose-ui-preview = { group="androidx.compose.ui", name="ui-tooling-preview" }

# Material 3
androidx-compose-material3 = { group="androidx.compose.material3", name="material3" }

# Coil
coil-compose = { group="io.coil-kt", name="coil-compose", version.ref="coil" }

# Testing
junit = { group="junit", name="junit", version.ref="junit" }
androidx-junit = { group="androidx.test.ext", name="junit", version.ref="androidxJunit" }
androidx-espresso = { group="androidx.test.espresso", name="espresso-core", version.ref="espresso" }

# Retrofit
retrofit = { group="com.squareup.retrofit2", name="retrofit", version.ref="retrofit"}
retrofit-gson = { group="com.squareup.retrofit2", name="converter-gson", version.ref="gsonConverter"}
okhttp-logging = { group="com.squareup.okhttp3", name="logging-interceptor", version.ref="okhttp"}

# Gson
gson = { group="com.google.code.gson", name="gson", version.ref="gson"}


# Navigation
androidx-navigation-compose = { group="androidx.navigation", name="navigation-compose", version.ref="navigation"}

# Animation From Nav
compose-animation = { group="androidx.compose.animation", name = "animation", version.ref = "composeAnimation"}

# Room Database
androidx-room-runtime = { group="androidx.room", name="room-runtime", version.ref="room"}
androidx-room-ktx = { group="androidx.room", name="room-ktx", version.ref="room"}
androidx-room-compiler = { group="androidx.room", name="room-compiler", version.ref="room"}
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "runtime" }

[plugins]
android-application = { id="com.android.application", version.ref="agp" }
kotlin-android = { id="org.jetbrains.kotlin.android", version.ref="kotlin" }
kotlin-compose = { id="org.jetbrains.kotlin.plugin.compose", version.ref="kotlin" }
kotlin-parcelize = { id ="org.jetbrains.kotlin.plugin.parcelize", version.ref="kotlin"}
ksp = { id = "com.google.devtools.ksp", version.ref="ksp"}